<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7ef">
    <title>Fruit List</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">Fresh picks</p>
            <h1>Fruit list</h1>
            <p class="intro">A simple list of fruits, straight from the orchard.</p>
        </header>
        <p id="status" class="status" role="status" aria-live="polite">Loading fruits…</p>
        <ul id="fruit-list" class="fruit-list" aria-label="Fruits">
            <!-- Fruits will be displayed here -->
             
        </ul>
    </main>
</body>
</html>
